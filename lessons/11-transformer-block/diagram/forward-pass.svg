<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1290" role="img" aria-labelledby="title desc"><title id="title">第十一节当前代码的前向流程</title><desc id="desc">手填查询键值后分成两个头，各自算注意力，再拼接投影，加回输入，归一化，送入前馈网络。</desc><defs><style>text {font-family: "SF Mono", "PingFang SC", "Noto Sans SC", sans-serif;}</style><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern></defs><rect width="1060" height="1290" fill="#0f172a"/><rect width="1060" height="1290" fill="url(#grid)"/><path d="M625 227V252" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M619 250H631L625 260Z" fill="#60a5fa"/><path d="M625 252V258H420V266 M625 258H830V266" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M420 432V456H830V432 M625 456V469" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M619 467H631L625 477Z" fill="#60a5fa"/><path d="M625 581V606" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M619 604H631L625 614Z" fill="#60a5fa"/><path d="M625 721V746" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M619 744H631L625 754Z" fill="#60a5fa"/><path d="M625 861V886" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M619 884H631L625 894Z" fill="#60a5fa"/><path d="M195 790H219" fill="none" stroke="#fbbf24" stroke-width="2"/><path d="M218 784V796L229 790Z" fill="#fbbf24"/><path d="M625 1001V1026" fill="none" stroke="#60a5fa" stroke-width="2"/><path d="M619 1024H631L625 1034Z" fill="#60a5fa"/><rect x="230" y="100" width="790" height="122" rx="12" fill="#132039" stroke="#334e71" stroke-width="1.4"/><rect x="230" y="266" width="380" height="166" rx="12" fill="#132039" stroke="#22d3ee" stroke-width="1.4"/><rect x="640" y="266" width="380" height="166" rx="12" fill="#132039" stroke="#a78bfa" stroke-width="1.4"/><rect x="230" y="480" width="790" height="96" rx="12" fill="#132039" stroke="#334e71" stroke-width="1.4"/><rect x="230" y="620" width="790" height="96" rx="12" fill="#132039" stroke="#334e71" stroke-width="1.4"/><rect x="230" y="760" width="790" height="96" rx="12" fill="#132039" stroke="#334e71" stroke-width="1.4"/><rect x="30" y="674" width="165" height="139" rx="12" fill="#292539" stroke="#fbbf24" stroke-width="1.4"/><rect x="230" y="900" width="790" height="96" rx="12" fill="#132039" stroke="#334e71" stroke-width="1.4"/><rect x="230" y="1040" width="790" height="186" rx="12" fill="#132039" stroke="#34d399" stroke-width="1.4"/><text x="36" y="45" font-size="30" fill="#e2e8f0" font-weight="700">第十一节 · 从多头注意力到前馈网络</text><text x="36" y="75" font-size="16" fill="#b1c2d8" font-weight="400">按当前 train.py 的前向计算绘制 · 两行依次是「去」「北」· 数据保留四位小数</text><text x="252" y="132" font-size="16" fill="#60a5fa" font-weight="700">00</text><text x="294" y="132" font-size="22" fill="#e2e8f0" font-weight="700">准备 Q、K、V</text><text x="910" y="131" font-size="17" fill="#bfdbfe" font-weight="700">[2, 2]</text><text x="252" y="162" font-size="17" fill="#b1c2d8" font-weight="400">Q = [[1, 3], [5, 7]]     K = [[2, 4], [6, 8]]</text><text x="252" y="187" font-size="17" fill="#b1c2d8" font-weight="400">V = [[3, 7], [11, 15]]</text><text x="252" y="212" font-size="17" fill="#b1c2d8" font-weight="400">第 16–27 行 · 本例手填三个矩阵，每行对应一个字。</text><text x="252" y="299" font-size="22" fill="#67e8f9" font-weight="700">01 · 头 1</text><text x="662" y="299" font-size="22" fill="#c4b5fd" font-weight="700">01 · 头 2</text><text x="252" y="328" font-size="17" fill="#b1c2d8" font-weight="400">取 Q、K、V 的第一列，各 [2, 1]</text><text x="662" y="328" font-size="17" fill="#b1c2d8" font-weight="400">取 Q、K、V 的第二列，各 [2, 1]</text><text x="252" y="357" font-size="17" fill="#b1c2d8" font-weight="400">点积 → 逐行 Softmax → 权重乘 V</text><text x="662" y="357" font-size="17" fill="#b1c2d8" font-weight="400">点积 → 逐行 Softmax → 权重乘 V</text><text x="252" y="386" font-size="18" fill="#67e8f9" font-weight="400">输出 [10.8561, 11.0000]ᵀ</text><text x="662" y="386" font-size="18" fill="#c4b5fd" font-weight="400">输出 [14.9999, 15.0000]ᵀ</text><text x="252" y="414" font-size="15" fill="#b1c2d8" font-weight="400">第 19–50 行 · 两个头各自分配权重</text><text x="662" y="414" font-size="15" fill="#b1c2d8" font-weight="400">每个头都读取「去」「北」两个位置</text><text x="252" y="512" font-size="16" fill="#60a5fa" font-weight="700">02</text><text x="294" y="512" font-size="22" fill="#e2e8f0" font-weight="700">拼接两个头的输出</text><text x="910" y="511" font-size="17" fill="#bfdbfe" font-weight="700">[2, 2]</text><text x="252" y="542" font-size="17" fill="#b1c2d8" font-weight="400">第 55 行 · torch.cat 沿特征列拼接，保留两个头各自的结果。</text><text x="252" y="567" font-size="17" fill="#b1c2d8" font-weight="400">「去」这一行  [10.8561, 14.9999]</text><text x="252" y="652" font-size="16" fill="#60a5fa" font-weight="700">03</text><text x="294" y="652" font-size="22" fill="#e2e8f0" font-weight="700">输出投影 W_o</text><text x="910" y="651" font-size="17" fill="#bfdbfe" font-weight="700">[2, 4]</text><text x="252" y="682" font-size="17" fill="#b1c2d8" font-weight="400">第 59–61 行 · 用 W_o 组合两个头的特征，并映射回四维。</text><text x="252" y="707" font-size="17" fill="#b1c2d8" font-weight="400">「去」这一行  [10.8561, 14.9999, 25.8561, -4.1438]</text><text x="252" y="792" font-size="16" fill="#60a5fa" font-weight="700">04</text><text x="294" y="792" font-size="22" fill="#e2e8f0" font-weight="700">残差相加</text><text x="910" y="791" font-size="17" fill="#bfdbfe" font-weight="700">[2, 4]</text><text x="252" y="822" font-size="17" fill="#b1c2d8" font-weight="400">第 68 行 · residual_output = X + projected_output</text><text x="252" y="847" font-size="17" fill="#b1c2d8" font-weight="400">「去」这一行  [11.8561, 17.0000, 28.8561, -0.1438]</text><text x="46" y="704" font-size="20" fill="#fcd68a" font-weight="700">原始输入 X</text><text x="46" y="733" font-size="15" fill="#fcd68a" font-weight="400">去 [1, 2, 3, 4]</text><text x="46" y="760" font-size="15" fill="#fcd68a" font-weight="400">北 [5, 6, 7, 8]</text><text x="46" y="790" font-size="15" fill="#b1c2d8" font-weight="400">第 65–66 行</text><text x="252" y="932" font-size="16" fill="#60a5fa" font-weight="700">05</text><text x="294" y="932" font-size="22" fill="#e2e8f0" font-weight="700">LayerNorm</text><text x="910" y="931" font-size="17" fill="#bfdbfe" font-weight="700">[2, 4]</text><text x="252" y="962" font-size="17" fill="#b1c2d8" font-weight="400">第 72–73 行 · 每个字单独归一化四个特征，控制表示的数值尺度。</text><text x="252" y="987" font-size="17" fill="#b1c2d8" font-weight="400">「去」这一行  [-0.2435, 0.2504, 1.3890, -1.3959]</text><text x="252" y="1072" font-size="16" fill="#60a5fa" font-weight="700">06</text><text x="294" y="1072" font-size="22" fill="#e2e8f0" font-weight="700">前馈网络 FFN</text><text x="910" y="1071" font-size="17" fill="#bfdbfe" font-weight="700">[2, 4]</text><text x="252" y="1104" font-size="17" fill="#b1c2d8" font-weight="400">第 81–87 行 · 两个位置分别通过同一个网络，逐行加工特征。</text><text x="252" y="1136" font-size="21" fill="#6ee7b7" font-weight="600">Linear(4, 16)    →    GELU    →    Linear(16, 4)</text><text x="252" y="1164" font-size="17" fill="#b1c2d8" font-weight="400">[2, 4] → [2, 16]          [2, 16] → [2, 4]</text><text x="252" y="1196" font-size="18" fill="#6ee7b7" font-weight="400">「去」这一行  [-0.3354, 0.1114, -0.3173, 0.1967]</text><text x="230" y="1260" font-size="16" fill="#b1c2d8" font-weight="400">图中输出是当前脚本的 FFN 结果。后续可接第二次残差和 LayerNorm。</text></svg>